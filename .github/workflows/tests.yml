name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version-file: "requirements-dev.txt"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend typecheck and tests
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test

      - name: Verify frontend build reproducibility and bundle sync
        run: |
          cd frontend
          npm run build
          if [ -n "$(git status --porcelain ../web/static)" ]; then
            if [ "${{ github.actor }}" = "dependabot[bot]" ] || [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
              echo "::notice::Static bundle drift detected on Dependabot PR. Bypassing failure since Dependabot does not compile frontend assets."
            elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::notice::Static bundle drift detected on main. Auto-committing synced bundle..."
              cd ..
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add web/static
              git commit -m "chore: auto-sync web/static bundle after merge [skip ci]"
              git push origin HEAD:main
            else
              echo "::error::Static bundle out of sync with frontend build:"
              git status --porcelain ../web/static
              git diff ../web/static
              exit 1
            fi
          fi

      - name: Upload static bundle on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-bundle-linux
          path: web/static/


  test-windows:
    name: Windows Python ${{ matrix.python-version }} (Full Test Suite)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite
        run: python -m pytest

  test-linux:
    name: Linux Python ${{ matrix.python-version }} (Core & CLI Portability)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest
