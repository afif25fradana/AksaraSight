name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version-file: "requirements-dev.txt"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend typecheck and tests
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test

      - name: Verify frontend build reproducibility and bundle sync
        run: |
          cd frontend
          npm run build
          if [ -n "$(git status --porcelain ../web/static)" ]; then
            if [ "${{ github.actor }}" = "dependabot[bot]" ] || [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
              echo "::notice::Static bundle drift detected on Dependabot PR. Bypassing failure since Dependabot does not compile frontend assets."
            elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::notice::Static bundle drift detected on main. Dedicated sync-static-bundle job will manage auto-commit."
            else
              # Pull Request from developer: check whether frontend source was modified without updating web/static
              cd ..
              BASE_REF="${{ github.base_ref || 'main' }}"
              CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || true)
              FRONTEND_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^frontend/' || true)
              STATIC_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^web/static/' || true)

              if [ -n "$FRONTEND_CHANGED" ] && [ -z "$STATIC_CHANGED" ]; then
                echo "::error::Frontend source files were modified in this PR, but web/static bundle was not updated. Please run 'npm run build' inside frontend/ and commit the compiled assets."
                git status --porcelain web/static
                exit 1
              else
                echo "::notice::Cross-OS static bundle variance detected (e.g. Windows vs Linux minification float precision), but compiled assets were updated or untouched. Build accepted."
              fi
            fi
          fi

      - name: Upload static bundle on mismatch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-bundle-linux
          path: web/static/

  sync-static-bundle:
    name: Auto-Sync Dependabot Static Bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.actor == 'dependabot[bot]' || github.event.head_commit.author.name == 'dependabot[bot]' || contains(github.event.head_commit.author.email, 'dependabot'))
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build and auto-commit drifted bundle
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          if [ -n "$(git status --porcelain web/static)" ]; then
            echo "::notice::Static bundle drift detected after Dependabot merge. Auto-committing synced bundle..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/static
            git commit -m "chore: auto-sync web/static bundle after merge [skip ci]"
            git push origin HEAD:main
          else
            echo "::notice::Static bundle is already in sync with dependencies."
          fi

  test-windows:
    name: Windows Python ${{ matrix.python-version }} (Full Test Suite)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite
        run: python -m pytest --cov --cov-report=term-missing --cov-report=markdown:coverage-windows-${{ matrix.python-version }}.md --cov-fail-under=89

      - name: Publish Coverage Table to Step Summary
        if: always()
        shell: pwsh
        run: |
          $covFile = "coverage-windows-${{ matrix.python-version }}.md"
          if (Test-Path $covFile) {
            "### Windows Python ${{ matrix.python-version }} Coverage Breakdown 📊" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content $covFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

  test-linux:
    name: Linux Python ${{ matrix.python-version }} (Core & CLI Portability)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest --cov --cov-report=term-missing
