name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "requirements-dev.txt"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend tests, typecheck & build
        run: cd frontend && npm ci && npm run lint && npm test && npm run build

  test-windows:
    name: Windows Python ${{ matrix.python-version }} (Full Test Suite)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite
        run: python -m pytest --cov --cov-report=term-missing --cov-report=markdown:coverage-windows-${{ matrix.python-version }}.md --cov-fail-under=89

      - name: Publish Coverage Table to Step Summary
        if: always()
        shell: pwsh
        run: |
          $covFile = "coverage-windows-${{ matrix.python-version }}.md"
          if (Test-Path $covFile) {
            "### Windows Python ${{ matrix.python-version }} Coverage Breakdown 📊" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content $covFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

  test-linux:
    name: Linux Python ${{ matrix.python-version }} (Core & CLI Portability)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest --cov --cov-report=term-missing --cov-report=markdown:coverage-linux-${{ matrix.python-version }}.md --cov-fail-under=89

      - name: Publish Coverage Table to Step Summary
        if: always()
        run: |
          cov_file="coverage-linux-${{ matrix.python-version }}.md"
          if [ -f "$cov_file" ]; then
            echo "### Linux Python ${{ matrix.python-version }} Coverage Breakdown 📊" >> $GITHUB_STEP_SUMMARY
            cat "$cov_file" >> $GITHUB_STEP_SUMMARY
          fi
