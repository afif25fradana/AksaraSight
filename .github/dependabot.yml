version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Pinned for version coupling and packaging stability; bumped manually
      - dependency-name: "customtkinter"
      - dependency-name: "tkinterdnd2"
      - dependency-name: "pypdfium2"
      - dependency-name: "python-docx"
      - dependency-name: "markdown-it-py"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
