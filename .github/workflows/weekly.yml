name: Weekly Maintenance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install --upgrade pip pip-audit

      - name: Audit requirements
        run: pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend npm dependencies
        run: |
          cd frontend
          npm audit

  test-windows:
    name: Windows Python ${{ matrix.python-version }} (Full Test Suite)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite
        run: python -m pytest --cov --cov-report=term-missing --cov-report=markdown:coverage-windows-${{ matrix.python-version }}.md --cov-fail-under=89

      - name: Publish Coverage Table to Step Summary
        if: always()
        shell: pwsh
        run: |
          $covFile = "coverage-windows-${{ matrix.python-version }}.md"
          if (Test-Path $covFile) {
            "### Windows Python ${{ matrix.python-version }} Coverage Breakdown 📊" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content $covFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

  test-linux:
    name: Linux Python ${{ matrix.python-version }} (Core & CLI Portability)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest --cov --cov-report=term-missing

  verify-portable-build:
    name: Windows Portable Binary Build & Smoke Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build portable Windows distribution
        run: python scripts/build_portable.py

      - name: Verify frozen CLI and headless Web UI server
        run: python scripts/verify_frozen_build.py

      - name: Verify frozen DOCX export parity
        run: python scripts/verify_frozen_docx.py
